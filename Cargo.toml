[package]
name = "apex_vector"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rayon = "1.7"
bincode = "1.3"
rand = "0.8"
tonic = "0.9"
prost = "0.11"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
ndarray = "0.15"

[build-dependencies]
tonic-build = "0.9"
